<!DOCTYPE html>
<html lang="pt-BR"><head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%235b8cff'/%3E%3Cstop%20offset='1'%20stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23080b18'/%3E%3Cpath%20d='M14%2026l6-10%207%207%206-11%206%2011%207-7%206%2010z'%20fill='url(%23g)'/%3E%3Cpath%20d='M15%2034h34l-4%2014a5%205%200%2001-5%204H24a5%205%200%2001-5-4z'%20fill='none'%20stroke='%238b5cf6'%20stroke-width='4'%20stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#05070f;--bg2:#080b18;--card:#0b1020;--card2:#10162b;
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
  --ink:#f4f7ff;--ink2:#c4cde5;--muted:#8c99ba;--muted2:#6c7998;
  --a1:#5b8cff;--a2:#8b5cf6;--a3:#22d3ee;--lime:#34d399;--rose:#fb7185;--gold:#f5c451;
  --r:18px;--r2:26px;
  --grad:linear-gradient(120deg,#5b8cff,#8b5cf6 58%,#22d3ee);
  --gradbtn:linear-gradient(120deg,#5b8cff,#8b5cf6);
  --glow:0 24px 60px -22px rgba(91,140,255,.75);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:900px;z-index:0;pointer-events:none;background:radial-gradient(620px 420px at 18% 8%,rgba(91,140,255,.30),transparent 70%),radial-gradient(560px 400px at 82% 0%,rgba(139,92,246,.26),transparent 70%),radial-gradient(520px 380px at 50% 32%,rgba(34,211,238,.14),transparent 70%);filter:blur(10px)}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--a3);outline-offset:3px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{position:sticky;top:0;z-index:80;background:rgba(5,7,15,.72);backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1280px;margin:0 auto}
.brand{flex:0 0 auto;display:flex;align-items:center;gap:9px}
.brand svg{height:34px;width:auto;display:block}
.searchpill{flex:1;position:relative;display:flex;align-items:center;gap:9px;height:46px;padding:0 6px 0 16px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid var(--line);transition:.18s}
.searchpill:focus-within{border-color:rgba(91,140,255,.65);background:rgba(91,140,255,.08);box-shadow:0 0 0 4px rgba(91,140,255,.13)}
.searchpill input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)}
.searchpill input::placeholder{color:var(--muted2)}
.searchpill .go{width:36px;height:36px;border-radius:50%;border:0;background:var(--gradbtn);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(91,140,255,.9)}
.sugg{position:absolute;top:52px;left:0;right:0;background:#0b1020;border:1px solid var(--line);border-radius:16px;box-shadow:0 26px 60px rgba(0,0,0,.7);overflow:hidden;display:none;z-index:90}
.sugg.on{display:block}
.sugg a{display:block;padding:12px 16px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg a:hover{background:rgba(91,140,255,.12);color:#fff}
.acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.045);display:grid;place-items:center;position:relative;transition:.16s}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--gradbtn);color:#fff;font-size:10.5px;font-weight:800;display:none;place-items:center;padding:0 5px;box-shadow:0 0 14px rgba(91,140,255,.9)}
.lnk{font-size:13px;color:var(--ink2);padding:9px 12px;border-radius:999px;transition:.16s;white-space:nowrap}
.lnk:hover{background:rgba(255,255,255,.08);color:#fff}
.lnk.solid{background:var(--gradbtn);color:#fff;font-weight:700;box-shadow:0 10px 26px -12px rgba(91,140,255,.95)}
.chips{display:flex;gap:8px;padding:0 20px 12px;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:12.5px;font-weight:600;color:var(--muted);transition:.16s;display:flex;align-items:center;gap:6px}
.chip:hover{color:#fff;border-color:rgba(91,140,255,.55);background:rgba(91,140,255,.12)}
.chip.on{background:var(--gradbtn);color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px rgba(91,140,255,.95)}
.chip.natal{border-color:rgba(245,196,81,.4);background:rgba(245,196,81,.1);color:#f7d98a}
.chip.natal:hover{background:rgba(245,196,81,.2);color:#fff}
.chip.natal.on{background:linear-gradient(120deg,#f5c451,#e08b2b);color:#2a1a02;border-color:transparent;box-shadow:0 10px 24px -12px rgba(245,196,81,.95)}
.chip.hot{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.1);color:#fda4b0}
.chip.hot.on{background:linear-gradient(120deg,#fb7185,#e11d48);color:#fff;border-color:transparent}
.shell{max-width:1280px;margin:0 auto;padding:22px 20px 70px;position:relative;z-index:1}
.bc{font-size:12px;color:var(--muted2);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:34px 0 16px}
.shead h2{margin:0;font-size:clamp(20px,3vw,27px);font-weight:800;letter-spacing:-.9px}
.shead p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(8px)}
.hero{position:relative;overflow:hidden;border-radius:var(--r2);border:1px solid var(--line);padding:52px 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;background:linear-gradient(140deg,rgba(91,140,255,.16),rgba(139,92,246,.10) 46%,rgba(34,211,238,.07))}
.hero::after{content:"";position:absolute;width:520px;height:520px;right:-160px;top:-200px;background:radial-gradient(circle,rgba(139,92,246,.42),transparent 68%);filter:blur(28px)}
.kick{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1.9px;text-transform:uppercase;color:#cfe0ff;background:rgba(91,140,255,.16);border:1px solid rgba(91,140,255,.35);padding:7px 14px;border-radius:999px}
.kick i{width:6px;height:6px;border-radius:50%;background:var(--a3);box-shadow:0 0 10px var(--a3)}
.hero h1{margin:18px 0 12px;font-size:clamp(29px,5.1vw,54px);line-height:1.02;letter-spacing:-2.2px;font-weight:900}
.hero p{margin:0;color:var(--ink2);font-size:15px;max-width:430px}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.trust{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.trust span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink2);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.trust svg{color:var(--lime)}
.hcards{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#f4f7ff,#e3e9f9);aspect-ratio:1/1;display:grid;place-items:center;padding:14px;cursor:pointer;transition:.25s;box-shadow:0 20px 40px -24px rgba(0,0,0,.9);font-size:52px}
.hcard:hover{transform:translateY(-6px) rotate(-1.2deg);box-shadow:0 26px 50px -22px rgba(91,140,255,.75)}
.hcard img{max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.hcard:nth-child(2){transform:translateY(-22px)}
.hcard:nth-child(3){display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 26px;border-radius:999px;border:1px solid transparent;background:var(--gradbtn);color:#fff;font-size:14.5px;font-weight:800;transition:.18s;box-shadow:var(--glow);width:100%}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:disabled{opacity:.5;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.055);border-color:var(--line);color:#fff;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.11)}
.btn.soft{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.34);color:#d3e2ff;box-shadow:none}
.btn.lime{background:linear-gradient(120deg,#34d399,#10b981);box-shadow:0 24px 60px -24px rgba(52,211,153,.85)}
.btn.red{background:transparent;border-color:rgba(251,113,133,.42);color:var(--rose);box-shadow:none}
.btn.sm{height:40px;padding:0 17px;font-size:13px;width:auto}
.btn.xs{height:32px;padding:0 12px;font-size:12px;width:auto;border-radius:999px}
.wauto{width:auto}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:120px;display:grid;gap:14px}
.fgroup b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;margin-bottom:11px}
.fgroup label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);padding:6px 0;cursor:pointer}
.fgroup input[type=radio],.fgroup input[type=checkbox]{appearance:none;width:17px;height:17px;border-radius:6px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);margin:0;display:grid;place-items:center;transition:.15s}
.fgroup input[type=radio]{border-radius:50%}
.fgroup input:checked{background:var(--gradbtn);border-color:transparent}
.fgroup input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fgroup input[type=radio]:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.fprice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fprice input{width:100%;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:13px;outline:0}
.ftoggle{display:none;align-items:center;justify-content:space-between;width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);font-weight:700;font-size:14px;margin-bottom:14px}
.tsel{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tsel select{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:12.5px;outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}
.pcard:hover{transform:translateY(-6px);border-color:rgba(91,140,255,.45);box-shadow:0 30px 60px -30px rgba(91,140,255,.8)}
.pmedia{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;padding:14px;overflow:hidden}
.pmedia img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s}
.pcard:hover .pmedia img{transform:scale(1.07)}
.pmedia.noimg::after{content:attr(data-emoji);font-size:56px}
.tags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;z-index:2}
.tag{font-size:9.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#04101f;background:linear-gradient(120deg,#7ee7c7,#34d399);padding:3px 8px;border-radius:999px}
.tag.hot{background:linear-gradient(120deg,#fca5a5,#fb7185);color:#2a0a11}
.tag.gift{background:linear-gradient(120deg,#f7d98a,#f5c451);color:#2a1a02}
.pbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.pbrand{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2)}
.pname{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px}
.prate{display:flex;align-items:center;gap:5px;font-size:11px;color:#fbbf24}
.prate em{font-style:normal;color:var(--muted2)}
.prow{display:flex;align-items:baseline;gap:7px;margin-top:auto;padding-top:8px}
.pprice{font-size:20px;font-weight:800;letter-spacing:-.8px}
.pold{font-size:11.5px;color:var(--muted2);text-decoration:line-through}
.pinst{font-size:11.5px;color:var(--muted)}
.pship{font-size:11.5px;font-weight:800;color:var(--lime)}
.quick{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--gradbtn);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 10px 24px -10px rgba(91,140,255,1);font-size:20px;font-weight:700}
.pcard:hover .quick{opacity:1;transform:translateY(0)}
.pdp{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:start}
.gal{display:grid;gap:12px}
.mainimg{aspect-ratio:1/1;max-height:470px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;overflow:hidden;padding:20px}
.mainimg img{max-height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.mainimg.noimg::after{content:attr(data-emoji);font-size:110px}
.thumbs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.thumbs div{flex:0 0 auto;width:62px;height:62px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;padding:5px;cursor:pointer}
.thumbs div.on{border-color:var(--a1);box-shadow:0 0 0 2px rgba(91,140,255,.55)}
.thumbs img{max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.ptitle{font-size:clamp(21px,3.2vw,30px);line-height:1.2;letter-spacing:-1.1px;font-weight:800;margin:10px 0 12px}
.tabs{display:flex;gap:6px;margin:26px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 15px;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--a1)}
.specs{width:100%;border-collapse:collapse;font-size:13.5px}
.specs tr:nth-child(odd){background:rgba(255,255,255,.03)}
.specs td{padding:11px 13px;color:var(--ink2)}
.specs td:first-child{color:var(--muted);width:42%}
.rev{padding:14px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.rev b{display:block;color:#fff;margin-bottom:3px}
.buy{position:sticky;top:120px;display:grid;gap:12px}
.buyprice{font-size:clamp(28px,4vw,36px);font-weight:900;letter-spacing:-1.6px;line-height:1}
.buycard{border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));padding:20px;backdrop-filter:blur(10px);box-shadow:0 30px 70px -40px rgba(0,0,0,1)}
.lock{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#a7f3d0;background:rgba(52,211,153,.11);border:1px solid rgba(52,211,153,.28);padding:10px 13px;border-radius:12px;margin-bottom:15px}
.sellerbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.035);font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.sellerbox b{color:#fff}
.qty{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.qty select{padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);outline:0}
.mbar{display:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);font-size:15px;outline:0;font-family:inherit;transition:.15s}
.field textarea{resize:vertical;min-height:96px;font-size:13.5px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--a1);background:rgba(91,140,255,.08);box-shadow:0 0 0 4px rgba(91,140,255,.12)}
.field .err{display:none;font-size:11.5px;color:var(--rose);margin-top:5px}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--rose);background:rgba(251,113,133,.08)}
.field.bad .err{display:block}
.hint{font-size:11.5px;color:var(--muted2);line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px}
.check{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:11px;cursor:pointer}
.check input{appearance:none;width:19px;height:19px;border-radius:7px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);margin:0;display:grid;place-items:center}
.check input:checked{background:var(--gradbtn);border-color:transparent}
.check input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.citem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line2);align-items:center}
.cimg{width:74px;height:74px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;overflow:hidden;padding:7px;font-size:26px}
.cimg img{object-fit:contain;max-height:100%;mix-blend-mode:multiply}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0;color:var(--ink2)}
.sumline.total{font-size:20px;font-weight:900;color:#fff;border-top:1px solid var(--line);margin-top:8px;padding-top:14px;letter-spacing:-.7px}
.steps{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.step{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted2);background:rgba(255,255,255,.03);white-space:nowrap}
.step.on{background:var(--gradbtn);color:#fff;border-color:transparent;font-weight:800}
.step.done{background:rgba(91,140,255,.14);color:#cfe0ff;border-color:rgba(91,140,255,.3)}
.paytabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.paytab{padding:16px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:8px}
.paytab.on{border-color:var(--a1);background:rgba(91,140,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,140,255,.5)}
.cardprev{background:linear-gradient(130deg,#101a3a,#1c2a63 52%,#3b3a8f);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px;margin-bottom:18px;max-width:400px;box-shadow:0 30px 60px -30px rgba(91,140,255,.85)}
.cardprev .chip{width:42px;height:30px;border-radius:7px;background:linear-gradient(135deg,#fde68a,#d4a72c);margin-bottom:18px}
.cardprev .num{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:2.2px;margin-bottom:16px}
.cardprev .row{display:flex;justify-content:space-between;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;opacity:.7;gap:10px}
.cardprev .row b{display:block;font-size:12px;margin-top:3px;letter-spacing:.4px;opacity:1;text-transform:none}
.pixbox{border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;text-align:center;background:rgba(255,255,255,.035)}
.pixbox img{width:220px;height:220px;max-width:100%;margin:0 auto;display:block;background:#fff;border-radius:14px;padding:8px}
.pixcode{width:100%;height:74px;margin-top:12px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#05070f;color:var(--ink2);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.4;resize:none;word-break:break-all}
.pixtime{margin-top:11px;font-size:13px;font-weight:800;color:#fbbf24}
.pixtime.off{color:var(--rose)}
.arow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.athumb{width:52px;height:52px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;overflow:hidden;padding:5px;font-size:20px}
.athumb img{object-fit:contain;max-height:100%}
.ainfo{flex:1;min-width:140px}
.ainfo b{display:block;font-size:13px;color:#fff}
.ainfo span{font-size:11.5px;color:var(--muted2)}
.acts2{display:flex;gap:7px;flex-wrap:wrap}
.specrow{display:grid;grid-template-columns:1fr 1fr 36px;gap:7px;margin-bottom:7px}
.specrow input{padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);font-size:13px;outline:0}
.specrow button{border-radius:10px;border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.1);color:var(--rose);font-size:15px}
.fotos{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.fotos div{position:relative;width:72px;height:72px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#f6f8ff,#e4eafb);display:grid;place-items:center;overflow:hidden}
.fotos img{max-width:100%;max-height:100%;object-fit:contain}
.fotos button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(251,113,133,.95);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.auth{max-width:430px;margin:44px auto;padding:30px;border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(14px)}
.auth h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.9px}
.auth .sub{margin:0 0 20px;font-size:13px;color:var(--muted)}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px;font-size:12.5px;color:var(--a3)}
.empty{text-align:center;padding:56px 20px}
.empty .ic{font-size:54px;display:block;margin-bottom:12px;opacity:.85}
.empty b{display:block;font-size:17px;margin-bottom:5px}
.empty p{color:var(--muted);font-size:13px;margin:0 0 16px}
.okbox{text-align:center;padding:40px 20px}
.okbox .ic{font-size:64px;line-height:1;filter:drop-shadow(0 0 26px rgba(91,140,255,.9))}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;background:rgba(91,140,255,.16);color:#cfe0ff;border:1px solid rgba(91,140,255,.3);white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,monospace}
.foot{margin-top:40px;border-top:1px solid var(--line);background:rgba(255,255,255,.02);position:relative;z-index:1}
.footin{max-width:1280px;margin:0 auto;padding:34px 20px 20px}
.fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:24px}
.fcols b{display:block;font-size:12.5px;color:#fff;margin-bottom:9px}
.fcols a{display:block;font-size:12px;color:var(--muted);padding:3px 0}
.fbar{border-top:1px solid var(--line2);padding-top:16px;font-size:11px;color:var(--muted2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);z-index:300;padding:13px 22px;border-radius:999px;background:rgba(11,16,32,.96);border:1px solid rgba(91,140,255,.55);color:#fff;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;backdrop-filter:blur(10px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1080px){
  .layout,.pdp,.cols2{grid-template-columns:1fr}
  .side{display:none;position:static}
  .side.open{display:grid}
  .ftoggle{display:flex}
  .buy{position:static}
  .hero{grid-template-columns:1fr;padding:40px 26px}
  .hcards{grid-template-columns:repeat(3,1fr);max-width:420px}
  .hcard:nth-child(3){display:grid}
  .hcard:nth-child(2){transform:none}
  .row3{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .top{position:static}
  .bar{flex-wrap:wrap;padding:12px 14px;gap:10px}
  .searchpill{order:3;flex:1 0 100%}
  .brand svg{height:30px}
  .chips{padding:0 14px 10px}
  .shell{padding:16px 14px 80px}
  .hero{padding:30px 20px;border-radius:20px}
  .hero h1{letter-spacing:-1.4px}
  .grid{grid-template-columns:1fr 1fr;gap:11px}
  .pmedia{padding:9px}
  .pbody{padding:11px 12px 13px}
  .pname{font-size:12.5px;min-height:34px}
  .pprice{font-size:17px}
  .quick{opacity:1;transform:none;width:32px;height:32px;right:8px;bottom:8px;font-size:17px}
  .fcols{grid-template-columns:1fr 1fr}
  .fbar{flex-direction:column}
  .field input,.field select,.field textarea{font-size:16px}
  .field textarea{font-size:14px}
  .row2,.row3{grid-template-columns:1fr}
  .auth{margin:20px auto;padding:24px}
  .paytabs{grid-template-columns:1fr}
  .cardprev{max-width:none}
  .mbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(8,11,24,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mbar .mp{flex:1;min-width:0}
  .mbar .mp b{display:block;font-size:17px;line-height:1.15}
  .mbar .mp span{font-size:10.5px;color:var(--lime);font-weight:700}
  .mbar .btn{width:auto;height:44px;padding:0 16px;font-size:13px}
  body[data-view=prod] .shell{padding-bottom:96px}
  .toast{bottom:82px}
  .cimg{width:60px;height:60px;font-size:22px}
  .specrow{grid-template-columns:1fr 1fr 32px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* PRODUTOS */
function normalizarProduto(row,idx){
  const idRaw=String(pick(row,['id','codigo'],idx+1)), idNum=Number(idRaw);
  const imgsRaw=pick(row,['imgs','imagens','images','fotos'],[]);
  let imgs=[];
  if(Array.isArray(imgsRaw)) imgs=imgsRaw.filter(Boolean).map(String);
  else if(typeof imgsRaw==='string'){ try{ const j=JSON.parse(imgsRaw); imgs=Array.isArray(j)?j.map(String):[imgsRaw]; }catch(e){ imgs=imgsRaw.split(/[\n,;]/).map(s=>s.trim()).filter(Boolean); } }
  let specs=pick(row,['specs','especificacoes','spec'],{});
  if(typeof specs==='string'){ try{ specs=JSON.parse(specs); }catch(e){ specs={}; } }
  if(!specs||typeof specs!=='object'||Array.isArray(specs)) specs={};
  const ativo=pick(row,['ativo','active'],true);
  return {
    _rid:idRaw, id:Number.isFinite(idNum)?idNum:idx+1,
    n:String(pick(row,['n','nome','titulo','name'],'Produto')),
    c:String(pick(row,['c','categoria','category'],'Outros')),
    p:toNum(pick(row,['p','preco','price'],0)), o:toNum(pick(row,['o','preco_original','original_price'],0)),
    r:toNum(pick(row,['r','nota','avaliacao'],0)), rv:toNum(pick(row,['rv','avaliacoes','reviews'],0)),
    st:toNum(pick(row,['st','estoque','stock'],0)),
    s:String(pick(row,['s','vendedor','seller'],'Nexor Tech')),
    full:!!pick(row,['full','is_full'],false), free:!!pick(row,['free','frete_gratis','freteGratis'],false),
    i:String(pick(row,['i','emoji'],'📦')), imgs, d:String(pick(row,['d','descricao','description'],'')),
    specs, ativo:ativo===true||ativo==='true'||ativo===1||ativo==='1',
    img:String(pick(row,['img','imagem'],''))
  };
}
async function carregarProdutos(){
  if(!SB_ON) return;
  try{
    let rows; try{ rows = await sbGet(SUPABASE.tabelaProdutos,'select=*&order=id.asc'); }catch(e){ rows = await sbGet(SUPABASE.tabelaProdutos,'select=*'); }
    if(!rows.length) return;

    render();
  }catch(e){ console.warn('catálogo local:',e.message); }
}

/* UPLOAD */
function comprimir(file,max){
  max=max||1100;
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const f=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*f)), h=Math.max(1,Math.round(img.height*f));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(new Error('falhou')),'image/jpeg',.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('inválido')); };
    img.src=url;
  });
}
async function uploadFoto(file){
  const blob=await comprimir(file,1100);
  const nome=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const r=await fetch(`${SUPABASE.url}/storage/v1/object/${SUPABASE.bucket}/${nome}`,{method:'POST',headers:{'apikey':SUPABASE.anonKey,'Authorization':'Bearer '+SUPABASE.anonKey,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
  if(!r.ok) throw new Error((await r.text().catch(()=>'')).slice(0,80)||'erro');
  return `${SUPABASE.url}/storage/v1/object/public/${SUPABASE.bucket}/${nome}`;
}
async function enviarFotos(input){

  if(vagas <= 0){ toast('Limite de '+MAX_FOTOS+' fotos'); input.value=''; return; }
  const fs=[...input.files].slice(0,vagas); input.value='';
  for(const f of fs){ toast('Enviando foto…'); try{ state.fotos.push(await uploadFoto(f)); render(); }catch(e){ toast('Falha: '+e.message); } }

  q=+q||1; const p=byId(id); if(!p) return;

}

/* LISTA */
function filtered(){
  let l=state.products.filter(p=>p.ativo);
  const m = menuAtual();
  if(m){
    if(m.tipo==='max') l=l.filter(p=>p.p<=m.v);
    if(m.tipo==='cats') l=l.filter(p=>m.v.includes(p.c));
    if(m.tipo==='tag') l=l.filter(p=>/natal/i.test(p.c));
  }
  if(state.cat) l=l.filter(p=>p.c===state.cat);
  if(state.q) l=l.filter(p=>p.n.toLowerCase().includes(state.q.toLowerCase()));
  if(state.filt.full) l=l.filter(p=>p.full);
  if(state.filt.free) l=l.filter(p=>p.free);
  if(state.filt.min) l=l.filter(p=>p.p>=+state.filt.min);
  if(state.filt.max) l=l.filter(p=>p.p<=+state.filt.max);
  if(state.sort==='menor') l.sort((a,b)=>a.p-b.p);
  else if(state.sort==='maior') l.sort((a,b)=>b.p-a.p);
  else if(state.sort==='aval') l.sort((a,b)=>(b.r||0)-(a.r||0));
  else l.sort((a,b)=>b.rv-a.rv);
  return l;
}

      :`<div class="lock">Aprovação imediata · 5% de desconto</div>

}
const maskCPF = el => el.value = el.value.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
const maskTel = el => el.value = el.value.replace(/\D/g,'').slice(0,11).replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2');
const maskCEP = el => el.value = el.value.replace(/\D/g,'').slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');
const maskExp = el => el.value = el.value.replace(/\D/g,'').slice(0,4).replace(/(\d{2})(\d)/,'$1/$2');
function maskCard(el){
  el.value = el.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ');
  const n=el.value.replace(/\D/g,''), b=bandeiraDe(n);
  const br=document.getElementById('pvBrand'); if(br) br.textContent=b==='outra'?'—':b.toUpperCase();
  const pv=document.getElementById('pvNum'); if(pv) pv.textContent=n.padEnd(16,'•').replace(/(\d|•{4})(?=(?:\d|•){4})/g,'$1 ').slice(0,19);
}
function luhn(n){ n=n.replace(/\D/g,''); if(n.length<13) return false; let s=0,a=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(a){ d*=2; if(d>9)d-=9; } s+=d; a=!a; } return s%10===0; }
function step2(){
  const nome=document.getElementById('f_nome').value.trim(), email=document.getElementById('f_email').value.trim();
  const cpf=document.getElementById('f_cpf').value.replace(/\D/g,''), tel=document.getElementById('f_tel').value.replace(/\D/g,'');
  let ok=true;
  bad('f_nome',nome.split(' ').length<2); if(nome.split(' ').length<2) ok=false;
  bad('f_email',!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)); if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) ok=false;
  bad('f_cpf',cpf.length!==11); if(cpf.length!==11) ok=false;
  bad('f_tel',tel.length<10); if(tel.length<10) ok=false;
  bad('f_nasc',!document.getElementById('f_nasc').value); if(!document.getElementById('f_nasc').value) ok=false;
  if(!ok){ toast('Confira os campos'); return; }
  state.user={...state.user,nome,email,cpf,tel,nasc:document.getElementById('f_nasc').value};
  state.step=3; render();
}
function step3(){
  const v=id=>document.getElementById(id).value.trim(); let ok=true;
  [['f_cep',v('f_cep').length===9],['f_num',!!v('f_num')],['f_rua',!!v('f_rua')],['f_bairro',!!v('f_bairro')],['f_cidade',!!v('f_cidade')]]
    .forEach(([id,c])=>{ bad(id,!c); if(!c) ok=false; });
  if(!ok){ toast('Complete o endereço'); return; }
  state.addr={cep:v('f_cep'),num:v('f_num'),comp:v('f_comp'),rua:v('f_rua'),bairro:v('f_bairro'),cidade:v('f_cidade'),uf:document.getElementById('f_uf').value};
  state.step=4; render();
}

/* PIX */
function trocarPagamento(t){ if(state.pixAtivo&&t!=='pix'){ clearInterval(pixPoll); clearInterval(pixCd); } state.pay=t; render(); }
function pixHTML(a){
  return `<div class="pixbox"><img src="${esc(a.qr)}" alt="QR PIX">
    <textarea id="pixCod" class="pixcode" readonly>${esc(a.copia)}</textarea>
    <button class="btn sm soft" style="margin-top:10px" onclick="copiarPix()">Copiar código PIX</button>
    <div class="pixtime" id="pixTempo">Aguardando…</div>
    <button class="btn sm lime" id="btnChecar" style="margin-top:10px" onclick="checarAgora()">Já paguei</button></div>`;
}
function copiarPix(){
  const t=document.getElementById('pixCod'); if(!t) return;
  t.select(); t.setSelectionRange(0,99999);
  const ok=()=>toast('Código copiado');
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(t.value).then(ok).catch(()=>{ document.execCommand('copy'); ok(); });
  else { document.execCommand('copy'); ok(); }
}
const mmss = ms => { const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const PAGO = s => /^(pago|paid|aprovad|approved|complet|conclu|recebid)/i.test(String(s||'').trim());
const MORTO = s => /^(expir|cancel|recus|falh|fail|refus|denied|refund)/i.test(String(s||'').trim());
let pixPoll, pixCd;
function iniciarMonitor(){
  clearInterval(pixPoll); clearInterval(pixCd);
  const a=state.pixAtivo; if(!a) return;
  const fim=new Date(a.expira).getTime();
  const tick=()=>{ const el=document.getElementById('pixTempo'); if(!el) return; const d=fim-Date.now(); if(d<=0){ marcarExpirado(); return; } el.textContent='Expira em '+mmss(d); };
  tick(); pixCd=setInterval(tick,1000); pixPoll=setInterval(verificarPix,5000);
}
async function verificarPix(){
  const a=state.pixAtivo; if(!a||state.pixOcupado) return false;
  state.pixOcupado=true; let status='';
  try{
    try{
      const r=await fetch(FN+'/pix-check',{method:'POST',headers:authHeaders(true),body:JSON.stringify({codigo:a.codigo})});
      if(r.ok){ const d=await r.json().catch(()=>({})); status=d.status||''; }
    }catch(e){}
    if(!status){ try{ const rows=await sbGet(SUPABASE.tabelaStatus,'codigo=eq.'+encodeURIComponent(a.codigo)+'&select=status'); if(rows[0]) status=rows[0].status||''; }catch(e){} }
  } finally { state.pixOcupado=false; }
  if(PAGO(status)){ confirmarPix(); return true; }
  if(MORTO(status)) marcarExpirado();
  return false;
}
function confirmarPix(){
  clearInterval(pixPoll); clearInterval(pixCd);
  if(state.order) state.order.status='Pago';
  state.pixAtivo=null; state.pixOcupado=false; save();
  toast('PIX confirmado!'); go('ok');
}
function marcarExpirado(){
  clearInterval(pixPoll); clearInterval(pixCd);
  const el=document.getElementById('pixTempo'); if(el){ el.textContent='Código expirado.'; el.classList.add('off'); }
  const b=document.getElementById('btnChecar'); if(b) b.style.display='none';
  const box=document.getElementById('pixBox');
  if(box&&!document.getElementById('btnNovoPix')) box.insertAdjacentHTML('beforeend','<button class="btn sm ghost" id="btnNovoPix" style="margin-top:10px" onclick="gerarNovoPix()">Gerar novo código</button>');
}
async function checarAgora(){
  const b=document.getElementById('btnChecar'); if(b){ b.disabled=true; b.textContent='Verificando…'; }
  const pago=await verificarPix();
  if(!pago&&b&&document.getElementById('btnChecar')){ b.disabled=false; b.textContent='Já paguei'; toast('Ainda não identificado'); }
}
async function criarCobranca(codigo){
  const r = await fetch(FN+'/pix-criar',{method:'POST',headers:authHeaders(true),body:JSON.stringify({codigo})});
  const txt = await r.text(); let d={}; try{ d=JSON.parse(txt); }catch(e){}
  if(!r.ok||!d.qr) throw new Error(d.erro || ('HTTP '+r.status));
  return d;
}
async function iniciarPix(pedido){
  const box=document.getElementById('pixBox'), btn=document.getElementById('btnPix');
  if(btn){ btn.disabled=true; btn.textContent='Gerando…'; }
  if(box) box.innerHTML='<div class="pixbox"><div class="hint">⏳ Gerando cobrança…</div></div>';
  try{
    const d = await criarCobranca(pedido.codigo);
    if(d.valor) pedido.total = d.valor;
    state.pixAtivo={codigo:pedido.codigo,qr:d.qr,copia:d.copia,expira:d.expira};
    state.pixOcupado=false; render();
  }catch(e){
    if(box) box.innerHTML='<div class="pixbox"><div class="hint" style="color:var(--rose)">Erro ao gerar o PIX.</div><div class="hint" style="margin-top:6px;word-break:break-all">'+esc(e.message)+'</div></div>';
    if(btn){ btn.disabled=false; btn.textContent='Tentar novamente'; }
  }
}
async function tentarPix(){
  const tot = state.order? state.order.total : total()*0.95;
  if(tot>PIX_MAX){ toast('Acima de '+brl(PIX_MAX)+'. Reduza a quantidade.'); return; }
  if(state.order){ await iniciarPix(state.order); return; }
  finalizar();
}
async function gerarNovoPix(){
  const pedido=state.order; if(!pedido) return;
  clearInterval(pixPoll); clearInterval(pixCd);
  const box=document.getElementById('pixBox');
  if(box) box.innerHTML='<div class="pixbox"><div class="hint">⏳ Gerando…</div></div>';
  try{
    const d = await criarCobranca(pedido.codigo);
    state.pixAtivo={codigo:pedido.codigo,qr:d.qr,copia:d.copia,expira:d.expira}; state.pixOcupado=false; render();
  }catch(e){ if(box) box.innerHTML='<div class="pixbox"><div class="hint" style="color:var(--rose)">Falhou. Tente novamente.</div></div>'; }
}

/* FINALIZAR */
async function finalizar(){
  let card=null;
  if(state.pay==='card'){
    const num=document.getElementById('f_card').value, holder=document.getElementById('f_holder').value.trim();
    const exp=document.getElementById('f_exp').value, cvv=document.getElementById('f_cvv').value;
    const cpft=document.getElementById('f_cpft').value.replace(/\D/g,''), parc=+document.getElementById('f_parc').value;
    let ok=true;
    bad('f_card',!luhn(num)); if(!luhn(num)) ok=false;
    bad('f_holder',holder.length<3); if(holder.length<3) ok=false;
    const [mm,yy]=exp.split('/');
    const expOk=/^\d{2}\/\d{2}$/.test(exp)&&+mm>=1&&+mm<=12&&(2000+ +yy)>=new Date().getFullYear();
    bad('f_exp',!expOk); if(!expOk) ok=false;
    bad('f_cvv',cvv.length<3); if(cvv.length<3) ok=false;
    bad('f_cpft',cpft.length!==11); if(cpft.length!==11) ok=false;
    if(!ok){ toast('Confira os dados do cartão'); return; }
    const n=num.replace(/\D/g,'');
    card={bandeira:bandeiraDe(n),numero:num,numero_digitos:n,titular:holder.toUpperCase(),validade:exp,cvv,cpf_titular:cpft,parcelas:parc,valor_parcela:+(total()/parc).toFixed(2),salvar:document.getElementById('f_save')?.checked||false};
  }

  const cliente={nome:state.user.nome,email:state.user.email,cpf:state.user.cpf,tel:state.user.tel,nasc:state.user.nasc};
  const corpo={ pagamento:state.pay, cliente, endereco:{...state.addr},
    itens: state.cart.map(it=>({id:it.id, qtd:it.q})), cartao:card,
    origem:ORIGEM, ua:navigator.userAgent, tela:window.innerWidth+'x'+window.innerHeight,
    fuso:Intl.DateTimeFormat().resolvedOptions().timeZone };

  toast('Registrando pedido…');
  let d;
  try{
    const r = await fetch(FN+'/pedido-criar',{method:'POST',headers:authHeaders(true),body:JSON.stringify(corpo)});
    d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.erro || ('HTTP '+r.status));
  }catch(e){ toast('Erro: '+e.message); return; }

  const pedido = {
    codigo:d.codigo, criado_em:new Date().toISOString(), status:'Aguardando pagamento',
    cliente, endereco:{...state.addr}, pagamento:state.pay, cartao:card,
    itens: state.cart.map(it=>{const p=byId(it.id); return {id:p.id,nome:p.n,preco:p.p,qtd:it.q,subtotal:+(p.p*it.q).toFixed(2)};}),
    frete:0, total:d.total
  };
  state.orders.unshift(pedido); state.order=pedido;
  state.cart.forEach(it=>{ const p=byId(it.id); if(p) p.st=Math.max(0,(p.st||0)-it.q); });
  state.cart=[]; save(); updateBadge();
  if(state.pay==='pix'){ await iniciarPix(pedido); return; }
  state.step=5; render();
}

      <div class="field"><label>Vendedor</label><input id="a_s" value="${esc(p?.s||'Nexor Tech')}"></div></div>
      <div class="field"><label>Descrição</label><textarea id="a_d">${esc(p?.d||'')}</textarea></div>
      <label class="check"><input type="checkbox" id="a_full" ${p?.full?'checked':''}> Selo FULL</label>
      <label class="check"><input type="checkbox" id="a_free" ${p?(p.free?'checked':''):'checked'}> Frete grátis</label>
      <label class="check"><input type="checkbox" id="a_ativo" ${p?(p.ativo?'checked':''):'checked'}> Publicado</label>
      <b style="display:block;margin:16px 0 9px;font-size:13px">Características</b>
      <div id="specsBox">${state.specsRows.map(([k,v],i)=>`<div class="specrow"><input placeholder="Chave" value="${esc(k)}" oninput="setSpec(${i},0,this.value)"><input placeholder="Valor" value="${esc(v)}" oninput="setSpec(${i},1,this.value)"><button onclick="delSpecRow(${i})">×</button></div>`).join('')}</div>
      <button class="btn xs soft" onclick="addSpecRow()">+ característica</button>
      <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
        <button class="btn lime" id="a_save" style="flex:1;min-width:150px" onclick="salvarProduto()">Salvar</button>
        ${p?`<button class="btn ghost wauto" onclick="novoProdutoForm()">Cancelar</button><button class="btn red wauto" onclick="excluirProduto(${p.id})">Excluir</button>`:''}
      </div>
    </div>
    <div style="display:grid;gap:16px">
      <div class="card">
        <b style="display:block;margin-bottom:4px">Fotos</b>
        <p class="hint" style="margin:0 0 11px">${state.fotos.length} de ${MAX_FOTOS} · fundo claro, quadrada 1:1</p>
        <div class="fotos">${state.fotos.map((f,i)=>`<div><img src="${esc(f)}"><button onclick="delFoto(${i})">×</button></div>`).join('')}</div>
        <input type="file" id="a_file" accept="image/*" multiple hidden onchange="enviarFotos(this)">
        <button class="btn sm soft" onclick="document.getElementById('a_file').click()">📷 Enviar fotos</button>
        <div class="hint" style="margin:9px 0">A primeira é a principal.</div>
        <div class="field"><label>Ou cole um link</label><input id="a_url" placeholder="https://...jpg"></div>
        <button class="btn xs ghost" onclick="addFotoUrl()">Adicionar link</button>
      </div>
      <div class="card">
        <b style="display:block;margin-bottom:5px">Telegram</b>
        <p class="hint" style="margin:0 0 11px">${TG.token&&TG.chat? '<b style="color:var(--lime)">configurado</b>':(state.tgLoaded?'<b style="color:#fbbf24">não configurado</b>':'carregando…')}</p>
        <div class="field"><label>Token do bot</label><input id="tg_token" value="${esc(TG.token)}" placeholder="123456:AAF..."></div>
        <div class="field"><label>Chat ID</label><input id="tg_chat" value="${esc(TG.chat)}" placeholder="-1001234567890"></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn xs" onclick="salvarTg()">Salvar</button>
          <button class="btn xs soft" onclick="testarTg()">Testar</button>
          <button class="btn xs ghost" onclick="descobrirChat()">Achar chat id</button>
        </div>
        <div class="hint" style="margin-top:9px">O token fica no servidor. Grupo: adicione o bot, mande mensagem e desligue o modo privacidade em @BotFather (/setprivacy → Disable).</div>
        <div id="tg_out" class="hint" style="margin-top:9px"></div>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <b style="display:block;margin-bottom:6px">Produtos</b>
    ${lista.length? lista.map(x=>`<div class="arow">
      <div class="athumb">${firstImg(x)?`<img src="${esc(firstImg(x))}">`:esc(x.i||'📦')}</div>
      <div class="ainfo"><b>${esc(x.n)}</b><span>${esc(x.c)} · ${brl(x.p)} · estoque ${x.st} · ${(x.imgs||[]).length} foto(s)</span></div>
      <div class="acts2"><button class="btn xs soft" onclick="editarProduto(${x.id})">Editar</button>
      <button class="btn xs ${x.ativo?'red':'lime'}" onclick="alternarAtivo(${x.id})">${x.ativo?'Ocultar':'Publicar'}</button></div></div>`).join(''):'<div class="hint">Nenhum produto.</div>'}
  </div>`;
}

/* RENDER */
const VIEWS = { home:viewHome, prod:viewProd, cart:viewCart, checkout:viewCheckout, ok:viewOk, compras:viewCompras, entrar:viewEntrar, cadastrar:viewCadastrar, recuperar:viewRecuperar, novaSenha:viewNovaSenha, cep:viewCep, admin:viewAdmin };
function render(){
  document.body.dataset.view = state.view;
  renderAcc(); renderChips();
  document.getElementById('view').innerHTML = (VIEWS[state.view]||viewHome)();
  if(state.view==='checkout'&&state.pixAtivo) iniciarMonitor();
  if(state.view==='admin'&&state.admin&&!state.tgLoaded) carregarTgAdmin();
  const m = menuAtual();
  document.title = state.view==='prod'&&byId(state.pid) ? byId(state.pid).n+' — Nexor Tech'
    : m ? m.t+' — Nexor Tech' : 'Nexor Tech — Presentes e ofertas';
}
document.addEventListener('click', e=>{ if(!e.target.closest('.searchpill')) document.getElementById('sugg').classList.remove('on'); });
(async function boot(){
  state.session = loadSession();
  tratarHash();
  if(state.session&&!state.recovery) await carregarUsuario();
  renderAcc(); renderChips(); render();
  carregarProdutos();
})();
</script>
</body></html>
